name: Nightly Hunt

# One run. No chaining, no heartbeat, no schedule.
#
# The task lives in GitHub issue #111 and nowhere else. This workflow only
# provides the org, the tools and a live log; what to do comes from the issue.
#
# Deliberately different from the previous loop: that one could not be cancelled
# (a chaining step guarded by `always()` fired on cancellation too and started a
# successor), and it silently resurrected old workflow versions. Neither failure
# mode can exist here, because there is exactly one run.

on:
  push:
    branches: [nightly-hunt]
    paths:
      - "nightly/**"
      - ".github/workflows/nightly-hunt.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: butler-lab-org
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          npm install --global @salesforce/cli
          npm install --global @anthropic-ai/claude-code

      - name: Reach the lab org
        env:
          LAB_AUTH: ${{ secrets.SFDX_AUTH_URL_LAB }}
        run: |
          if [ -z "$LAB_AUTH" ]; then
            echo "::error::SFDX_AUTH_URL_LAB is not set"; exit 1
          fi
          printf '%s' "$LAB_AUTH" > /tmp/lab.url
          sf org login sfdx-url --sfdx-url-file /tmp/lab.url --alias butler-lab
          rm -f /tmp/lab.url

          # Note: fields are selected explicitly - `sf org display` prints the
          # access token, and this log is world-readable.
          sf org display --target-org butler-lab --json \
            | python3 -c "import sys,json;d=json.load(sys.stdin)['result'];print('org:',d['instanceUrl'])"

          sf data query --target-org butler-lab \
            --query "SELECT VersionNumber, Status FROM BotVersion WHERE BotDefinition.DeveloperName='MyOrgButler'"

      - name: Hunt
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.BUTLER_LAB_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set +e
          claude --print \
            --output-format stream-json --verbose \
            --model claude-opus-5 \
            --permission-mode bypassPermissions \
            --max-turns 400 \
            < nightly/PROMPT.md \
            | tee /tmp/raw.jsonl \
            | python3 nightly/stream.py
          echo "claude exit code: ${PIPESTATUS[0]}"

      - name: Confirm it reported
        if: always()
        env:
          GH_TOKEN: ${{ secrets.BUTLER_LAB_PAT || secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh issue view 111 --json comments --jq '.comments | length')
          echo "comments on #111: $count"
          if [ "$count" -eq 0 ]; then
            echo "::warning::the run posted nothing to issue #111"
          fi
